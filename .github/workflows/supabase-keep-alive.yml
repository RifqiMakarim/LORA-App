name: Supabase Keep Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pada pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Mengizinkan eksekusi manual kapan saja melalui tab Actions di GitHub

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Check Secrets and Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL atau NEXT_PUBLIC_SUPABASE_ANON_KEY belum ditambahkan di GitHub Secrets!"
            exit 1
          fi

          echo "🚀 Menghubungi Supabase REST API ($SUPABASE_URL)..."

          # Melakukan request ringan ke endpoint REST API Supabase PostgREST
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY")

          echo "Supabase HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Berhasil! Database Supabase aktif dan terhindar dari auto-pause."
          else
            echo "::error::Gagal menghubungi Supabase, kode status: $HTTP_STATUS"
            exit 1
          fi
