name: Supabase Keep Alive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pada pukul 00:00 UTC (07:00 WIB)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Mengizinkan eksekusi manual kapan saja melalui tab Actions di GitHub

jobs:
  keep-alive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Check Secrets and Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Utamakan SUPABASE_SERVICE_ROLE_KEY (bypass RLS), fallback ke ANON_KEY jika tidak ada
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL atau API KEY belum dikonfigurasi di GitHub Secrets!"
            echo "Pastikan Anda telah menambahkan SUPABASE_SERVICE_ROLE_KEY atau NEXT_PUBLIC_SUPABASE_ANON_KEY."
            exit 1
          fi

          # Bersihkan trailing slash jika ada
          CLEAN_URL="${SUPABASE_URL%/}"

          echo "🚀 Menghubungi Supabase REST API di: $CLEAN_URL..."

          # Lakukan request ke PostgREST API dan tangkap response body & HTTP code
          TEMP_FILE=$(mktemp)
          HTTP_STATUS=$(curl -s -o "$TEMP_FILE" -w "%{http_code}" \
            -X GET "$CLEAN_URL/rest/v1/" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          
          RESPONSE_BODY=$(cat "$TEMP_FILE")
          rm -f "$TEMP_FILE"

          echo "Supabase HTTP Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ BERHASIL! Database Supabase aktif dan terhindar dari auto-pause."
          else
            echo "::error::Gagal menghubungi Supabase (HTTP $HTTP_STATUS)."
            echo "Detail Pesan dari Supabase: $RESPONSE_BODY"
            echo "Tips: Pastikan SUPABASE_SERVICE_ROLE_KEY di GitHub Secrets sudah sesuai dengan yang ada di Supabase Dashboard (Settings -> API)."
            exit 1
          fi
